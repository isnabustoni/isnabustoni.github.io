<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Publications</title>
<link rel="stylesheet" href="css/style.css">

<style>

/* Layout */
#pub-list{
max-width:900px;
margin:auto;
padding:20px;
}

/* Card */
.pub-card{
display:flex;
gap:15px;
background:white;
border:1px solid #eee;
border-radius:12px;
overflow:hidden;
margin-bottom:20px;
transition:0.2s;
}

.pub-card:hover{
transform:translateY(-3px);
box-shadow:0 6px 16px rgba(0,0,0,0.08);
}

/* Thumbnail */
.pub-thumb{
width:160px;
flex-shrink:0;
}

.pub-thumb img{
width:100%;
height:100%;
object-fit:cover;
}

/* Content */
.pub-content{
padding:15px;
flex:1;
}

.pub-title{
font-weight:600;
font-size:16px;
margin-bottom:6px;
}

.pub-meta{
font-size:14px;
color:#555;
margin-bottom:6px;
}

.pub-desc{
font-size:14px;
color:#444;
margin-bottom:10px;
}

.pub-links a{
text-decoration:none;
font-size:14px;
color:#0066cc;
}

.pub-links a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<header>
<h1>Publications</h1>

<nav>
<a href="index.html">Home</a>
<a href="publications.html">Publications</a>
<a href="projects.html">Projects</a>
<a href="design.html">Design</a>
<a href="cv.html">CV</a>
</nav>
</header>


<section>

<h2 style="text-align:center;">Research Publications</h2>

<div id="pub-list"></div>

</section>


<script>

fetch("data/google_scholar.json")
.then(response => response.json())
.then(data => {

  const container = document.getElementById("pub-list");

  // sort newest first
  data.sort((a,b) => b.year - a.year);

  data.forEach(pub => {

    const div = document.createElement("div");
    div.className = "pub-card";

    // highlight your name
    let authors = pub.authors || "";
    authors = authors.replace("Isna Alfi Bustoni", "<strong>Isna Alfi Bustoni</strong>");

    // thumbnail (fallback if missing)
    const thumbnail = pub.thumbnail || "images/default.jpg";

    div.innerHTML = `
      <div class="pub-thumb">
        <img src="${thumbnail}" alt="thumbnail">
      </div>

      <div class="pub-content">

        <div class="pub-title">
          ${pub.title}
        </div>

        <div class="pub-meta">
          ${authors}<br>
          <i>${pub.venue || ""}</i> (${pub.year || ""})
        </div>

        <div class="pub-desc">
          ${pub.description || "Research work in HCI, data science, or intelligent systems."}
        </div>

        <div class="pub-links">
          <a href="${pub.link}" target="_blank">View Paper</a>
        </div>

      </div>
    `;

    container.appendChild(div);

  });

})
.catch(error => console.error("Error loading publications:", error));

</script>

</body>
</html>
