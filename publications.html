<section>

<h2 style="text-align:center;">Research Publications</h2>

<div id="pub-list"></div>

</section>

<script>

fetch("data/google_scholar.json")
.then(response => response.json())
.then(data => {

  const container = document.getElementById("pub-list");

  // sort newest first
  data.sort((a,b) => b.year - a.year);

  data.forEach(pub => {

    const div = document.createElement("div");
    div.className = "pub-card";

    // highlight your name
    let authors = pub.authors || "";
    authors = authors.replace("Isna Alfi Bustoni", "<strong>Isna Alfi Bustoni</strong>");

    // thumbnail fallback
    const thumbnail = pub.thumbnail || "images/default.png";
    const tag = pub.tag || "";

    div.innerHTML = `
      ${tag ? `<div class="pub-tag">${tag}</div>` : ""}
    
      <div class="pub-thumb">
        <img src="${thumbnail}" alt="thumbnail">
      </div>
    
      <div class="pub-content">
    
        <div class="pub-title">
          ${pub.title}
        </div>
    
        <div class="pub-meta">
          ${authors}<br>
          <i>${pub.venue}</i> (${pub.year})
        </div>
    
        <div class="pub-desc">
          ${pub.description || ""}
        </div>
    
        <div class="pub-links">
          <a href="${pub.link}" target="_blank">View Paper</a>
        </div>
    
      </div>
    `;



    
    // const thumbnail = pub.thumbnail || "images/default.jpg";

    // div.innerHTML = `
    //   <div class="pub-thumb">
    //     <img src="${thumbnail}" alt="thumbnail">
    //   </div>

    //   <div class="pub-content">

    //     <div class="pub-title">
    //       ${pub.title}
    //     </div>

    //     <div class="pub-meta">
    //       ${authors}<br>
    //       <i>${pub.venue || ""}</i> (${pub.year || ""})
    //     </div>

    //     <div class="pub-desc">
    //       ${pub.description || "Research in HCI, AI, or data-driven systems."}
    //     </div>

    //     <div class="pub-links">
    //       <a href="${pub.link}" target="_blank">View Paper</a>
    //     </div>

    //   </div>
    // `;

    container.appendChild(div);

  });

})
.catch(error => console.error("Error loading publications:", error));

</script>

</body>
</html>
